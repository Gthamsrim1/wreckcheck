name: WreckCheck
description: Find what will wreck your release

branding:
  icon: shield
  color: red

inputs:
  fail-on:
    description: Minimum severity that fails CI
    required: false
    default: critical

  verify:
    description: Run build, lint, and test verification
    required: false
    default: false

outputs:
  sarif:
    description: Generated SARIF file path

  findings:
    description: Number of findings

runs:
  using: node24
  main: dist/index.cjs